name: Build VSIX

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let a release update finish before another build can replace its assets.
  cancel-in-progress: false

jobs:
  package:
    name: Test and package extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm test
          node --test .github/scripts/*.test.js

      - name: Check types
        run: npm run check-types

      - name: Build VSIX
        run: npx --yes @vscode/vsce@4.1.0 package --out vscode-vinyl.vsix

      - name: Verify VSIX contents
        run: python3 .github/scripts/verify-vsix.py vscode-vinyl.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-vinyl
          path: vscode-vinyl.vsix
          if-no-files-found: error

  release:
    name: Publish latest branch VSIX
    needs: package
    if: github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Download verified VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-vinyl

      - name: Verify downloaded VSIX
        run: python3 .github/scripts/verify-vsix.py vscode-vinyl.vsix

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-release.js
